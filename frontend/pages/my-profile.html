<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef1f6; margin: 0; padding: 20px; }
        .box { max-width: 650px; margin: 0 auto; background: #fff; padding: 24px;
               border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
        h1 { margin-top: 0; }
        a { display: inline-block; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .full { grid-column: span 2; }
        .label { font-size: 13px; color: #666; }
        .value { font-size: 16px; margin-top: 4px; padding: 8px;
                 background: #f4f6fa; border-radius: 6px; min-height: 20px; }
        #msg { margin-top: 12px; text-align: center; color: #c00; }
    </style>
</head>
<body>
<div class="box">
    <a href="passenger-dashboard.html">&larr; Back to dashboard</a>
    <h1>My Profile</h1>

    <div class="grid">
        <div><div class="label">First name</div><div class="value" id="firstName"></div></div>
        <div><div class="label">Last name</div><div class="value" id="lastName"></div></div>
        <div><div class="label">Date of birth</div><div class="value" id="dateOfBirth"></div></div>
        <div><div class="label">Gender</div><div class="value" id="gender"></div></div>
        <div><div class="label">Nationality</div><div class="value" id="nationality"></div></div>
        <div><div class="label">Phone</div><div class="value" id="phone"></div></div>
        <div class="full"><div class="label">Email</div><div class="value" id="email"></div></div>
        <div class="full"><div class="label">Address</div><div class="value" id="address"></div></div>
        <div><div class="label">Passport number</div><div class="value" id="passportNumber"></div></div>
        <div><div class="label">Passport expiry</div><div class="value" id="passportExpiry"></div></div>
        <div class="full"><div class="label">Passport country</div><div class="value" id="passportCountry"></div></div>
    </div>
    <div id="msg"></div>
</div>

<script>
    const msg = document.getElementById("msg");
    const fields = ["firstName", "lastName", "dateOfBirth", "gender", "nationality",
                    "phone", "email", "address", "passportNumber", "passportExpiry", "passportCountry"];

    async function loadProfile() {
        const meRes = await fetch("/api/auth/me");
        if (meRes.status === 401) { window.location.href = "login.html"; return; }
        const me = await meRes.json();

        const res = await fetch("/api/passengers/" + me.passengerId);
        if (!res.ok) { msg.textContent = "Could not load profile."; return; }
        const p = await res.json();

        fields.forEach(function (f) {
            document.getElementById(f).textContent = p[f] || "-";
        });
    }

    loadProfile();
</script>
</body>
</html>
